# Project Ages: only the settings we change. Distant Horizons fills in the rest
# (and rewrites this file with every setting on first start).
[common]
	# Far terrain gets about a quarter of the processor, so the real chunks around the player load first
	# and far terrain fills in behind them (owner test 2026-10-29: chunks slow to load). DH's own thread
	# count stays (half the CPU threads, sized to each computer); each thread runs half the time and
	# below the game's own threads. Not threadPreset = "LOW_IMPACT": DH only applies a preset when it is
	# picked in its settings screen, so in this file it did nothing (2026-11-05: 20 threads at full
	# speed on a 40-thread server, the Test Server lagging).
	[common.multiThreading]
		threadRunTimeRatio = "0.5"
		threadPriority = 3
	[common.logging]
		[common.logging.warning]
			# The "G1 garbage collector detected" chat warning on every join.
			showGarbageCollectorWarning = false
			# The chat warning about mods it has hooks for.
			showModCompatibilityWarningsOnStartup = false
	[common.worldGenerator]
		# Far terrain is the landscape only (no trees, ores or structures). With features on, DH's own
		# threads place Immersive Petroleum oil reservoirs, whose lock deadlocks the server's main
		# thread (froze the server, 2026-10-02). Also far lighter on the CPU.
		generatorPlan = "SURFACE_ONLY"
[client]
	[client.advanced]
		[client.advanced.graphics]
			[client.advanced.graphics.quality]
				# Far-terrain view distance in chunks (DH default 256). 64 keeps the far view but is much
				# lighter for mid-range PCs (player report 2026-10-27: long loads, chunks barely loading).
				lodChunkRenderDistanceRadius = 64
			[client.advanced.graphics.experimental]
				# Off in orbit (owner test 2026-11-04: glitches around a Northstar rocket). Orbits are empty
				# space with nothing far off to draw; the planets keep it.
				ignoredDimensionCsv = "ad_astra:earth_orbit,ad_astra:moon_orbit,ad_astra:mars_orbit,ad_astra:venus_orbit,ad_astra:mercury_orbit,ad_astra:glacio_orbit"
