# Project Ages: JEI settings. JEI fills in every setting not listed here.
# Both options below listed every member of a tag, which revealed items from
# mods that are still locked (AStages only hides items from the main list).

[recipes]
# The "Item Tags" pages (e.g. "Any Planks" showing every modded wood).
showTagRecipesEnabled = false

[tooltips]
# The row of all matching items under a tag ingredient's tooltip.
tagContentTooltipEnabled = false
